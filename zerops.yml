# How each service is built and run on Zerops.
#
# The hostnames here match the services in zerops-project-import.yml exactly,
# and `setup` is what `zcli push --setup` and the deploy workflow select.

zerops:
  # --- The API --------------------------------------------------------------
  - setup: backend
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - corepack prepare pnpm@11.13.0 --activate
        - pnpm install --frozen-lockfile
        # The trailing `...` is what builds the workspace packages the backend
        # depends on, in order, rather than only the backend itself. Without it
        # `packages/schemas/dist` is never produced and the deployed service
        # cannot import it.
        - pnpm --filter "@layered/backend..." build
      deployFiles:
        - apps/backend/dist
        # The generated migrations and their journal. Without them the runner
        # starts, finds no journal and stops the deployment, which is what
        # happened the first time this ran.
        - apps/backend/drizzle
        - apps/backend/node_modules
        - apps/backend/package.json
        # The shared schemas, which the backend reaches through a symlink in
        # its own node_modules. The link points at this path, so all three of
        # these have to be here: the built output, the manifest that says where
        # its entry point is, and its own node_modules, because a package
        # resolves its dependencies from beside itself rather than from
        # whoever imported it. Without the last one the service starts and
        # exits with "Cannot find package 'zod' imported from
        # /var/www/packages/schemas/dist/errors.js".
        - packages/schemas/dist
        - packages/schemas/package.json
        - packages/schemas/node_modules
        # The response headers each host sends. It depends on nothing, so it
        # has no node_modules of its own and needs only these two.
        - packages/policy/dist
        - packages/policy/package.json
        # Password hashing, which the sign-in route imports. Like the policy
        # package it has no runtime dependency of its own, so two paths are
        # enough. Without them the service exits on start with "Cannot find
        # package '@layered/passwords'".
        - packages/passwords/dist
        - packages/passwords/package.json
        - node_modules
        - package.json
      cache: node_modules
    deploy:
      # Whether this new container may take over, asked only whilst a deployment
      # is rolling out. It reaches the database and says which of three things
      # is wrong: the tables are absent, the role cannot write to them, or the
      # schema is older than the code. A container in any of those states
      # answers every request and fails the ones that matter, so it never
      # replaces the one already running.
      #
      # No `retryPeriod` or `failureTimeout` here. Both the specification's own
      # example and the published JSON Schema give them as plain integers, and
      # zcli refuses the whole file with "cannot unmarshal !!int 60 into
      # time.Duration". The defaults do the job, so the working configuration is
      # the one with neither.
      readinessCheck:
        httpGet:
          port: 3000
          path: /health/ready
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        # Dual stack. Zerops service discovery can return an IPv6 upstream, and
        # binding to IPv4 alone has produced intermittent gateway errors in the
        # sibling projects.
        HOST: 0.0.0.0
        # No PORT here. Zerops holds that key and rejects the whole file when it
        # appears, so the number lives under `ports` and the process falls back
        # to the same one itself.
        NODE_ENV: production
        DATABASE_URL: ${postgres_connectionString}/${postgres_dbName}
        # The role Zerops connects as, read off the first successful migration:
        # `migrations applied as db`. Naming it makes the runner refuse anything
        # else as well, so a schema cannot end up owned by whoever happened to
        # be connected. It is not a superuser, which the run before this one
        # proved by not being refused.
        DATABASE_EXPECTED_ROLE: db
        # The two origins that may call this API with a cookie. Public
        # addresses rather than secrets, so they belong here where a diff shows
        # them, and they are read from configuration rather than from a request
        # header, which a caller controls.
        SITE_ORIGIN: https://layered.work
        DASHBOARD_ORIGIN: https://dashboard.layered.work
        S3_ENDPOINT: ${assets_apiUrl}
        S3_BUCKET: ${assets_bucketName}
        S3_ACCESS_KEY_ID: ${assets_accessKeyId}
        S3_SECRET_ACCESS_KEY: ${assets_secretAccessKey}
        # Who mail comes from. An address rather than a secret, so it stands
        # here where a diff shows it, whilst the key that sends it is a secret
        # variable on the service. SMTP2GO has to have this sender verified, and
        # the domain has to carry the SPF and DKIM records it asks for.
        EMAIL_FROM: phranck@layered.work
      # Every migration that has not run, before the service starts answering.
      # It refuses to run as a superuser and stops the deployment when it does,
      # so a schema is never created by a role that bypasses every grant.
      initCommands:
        - node apps/backend/dist/db/migrate.js
      start: node apps/backend/dist/index.js
      # Liveness, and liveness only. This one runs continuously and takes a
      # container out of service when it fails, so it must not reach the
      # database: a dependency that is briefly slow would be reported as a dead
      # process and every container would go with it. Readiness is the check
      # above, which asks the harder question and asks it only during a rollout.
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  # --- The public site ------------------------------------------------------
  - setup: website
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - corepack prepare pnpm@11.13.0 --activate
        - pnpm install --frozen-lockfile
        # The trailing `...` builds the workspace packages this one depends
        # on, in order. Every service uses this form: there is no case where a
        # build should leave a dependency unbuilt, and the one that did not
        # failed on `Rolldown failed to resolve import "@layered/policy"`.
        - pnpm --filter "@layered/website..." build
      deployFiles:
        # Astro's build puts the server under dist/server and everything served
        # as a file, public/ included, under dist/client. The wordmark, the
        # typefaces and the sharing image are all in there, so public/ is not
        # deployed a second time.
        - apps/website/dist
        - apps/website/content
        - apps/website/package.json
        # Astro leaves a dependency it did not bundle to be resolved at run
        # time, and it resolves from beside the app rather than from the root.
        # Zod is the first such dependency the site has, and without this the
        # server exits with "Cannot find package 'zod'".
        - apps/website/node_modules
        - node_modules
        - package.json
      cache: node_modules
    deploy:
      # The site has no dependency to be ready for, so this asks the same thing
      # the health check does. It is here because it is what actually holds a
      # new container back until it answers: the health check watches what is
      # already running.
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        HOST: 0.0.0.0
        NODE_ENV: production
        # Over the internal network rather than the public address, so a page
        # render does not leave the project and come back.
        API_URL: http://backend:3000
        # Whether the countdown or the site answers. `auto` asks the clock and
        # the host on every request, which is what makes the launch happen by
        # itself. Set it to `countdown` to put the notice back up without moving
        # the date and without a deployment, or to `site` to open early.
        WEBSITE_MODE: auto
        # What the deployed site reads until it reads the database. The file is
        # committed and carries only what a reader may reach, which a test in
        # the website enforces.
        WEBSITE_CONTENT_FILE: /var/www/apps/website/content/site.json
        # Where the media actually are. The snapshot records every asset as
        # /media/<file>, which is the path on the machine that produced it; a
        # deployment has no such directory and the files sit in the bucket
        # instead, under the prefix the migration wrote them to. The policy in
        # @layered/policy names the same host, because the browser refuses a
        # picture from an origin the page did not declare.
        # The host is written out because Zerops does not resolve
        # ${assets_storageCdnUrl} here: the deployed page carried that
        # reference verbatim in every image source. It is no secret, and
        # @layered/policy names the same host for the browser. The bucket name
        # is a reference, and that one does resolve.
        MEDIA_ORIGIN: https://storage.cdn.zerops.app/${assets_bucketName}/migration
      # Nothing but the command. This line is handed to `exec`, not to a shell,
      # so `PORT=3000 node …` here is read as the name of a program to run and
      # fails with "not found": the service then restarts in a loop and the site
      # answers 502. The port is set in astro.config.mjs instead, where it has to
      # match the one declared above.
      start: node apps/website/dist/server/entry.mjs
      # Watches what is running, continuously, and takes a container out of
      # service when it stops answering. Liveness only: it says the server is
      # answering and touches nothing else.
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  # --- The dashboard --------------------------------------------------------
  # Built to static files and served by nginx, which is why it is the one
  # service that runs no Node process.
  - setup: dashboard
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - corepack prepare pnpm@11.13.0 --activate
        - pnpm install --frozen-lockfile
        - pnpm --filter "@layered/dashboard..." build
      deployFiles:
        - apps/dashboard/dist
      cache: node_modules
      envVariables:
        # nginx forwards same-origin /api/ requests over the private network.
        # Keeping the edge's forwarding chain intact preserves caller limits;
        # calling the public API here would add another pair of proxy hops.
        API_ORIGIN: http://backend:3000
    deploy:
      # nginx starts whatever is in the document root, including nothing, so a
      # build that produced no index.html would otherwise replace a working
      # dashboard with a directory listing or a 404. Asking for the page itself
      # is the whole check this service needs.
      readinessCheck:
        httpGet:
          port: 80
          path: /
    run:
      base: nginx@1.22
      ports:
        - port: 80
          httpSupport: true
      documentRoot: apps/dashboard/dist
      # nginx serves this host, so nginx is what puts the headers on it. The
      # file is generated by the dashboard's build from the same definitions the
      # other two surfaces read, so a copy of a security header cannot drift.
      siteConfigPath: apps/dashboard/dist/site.conf
