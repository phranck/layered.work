name: Gate

# Lint, types, tests and a build of everything, in one job. Two jobs would mean
# a second runner and a second install of the dependencies, which is the
# expensive part, for gates that take nothing from each other.
#
# Called rather than triggered, by the pull request workflow and by the deploy
# workflow, so that the two cannot drift into checking different things. A gate
# written out twice is a gate that is eventually only half applied, and the half
# that is missing is invisible.
#
# Nothing here interpolates anything a stranger can write. Every `run` is a
# fixed command over fixed values.
on:
  workflow_call:
    # Which apps the change reaches, so the deploy rolls out exactly those and
    # never one this run tested without its database.
    outputs:
      backend:
        value: ${{ jobs.gate.outputs.backend }}
      website:
        value: ${{ jobs.gate.outputs.website }}
      dashboard:
        value: ${{ jobs.gate.outputs.dashboard }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.affected.outputs.backend }}
      website: ${{ steps.affected.outputs.website }}
      dashboard: ${{ steps.affected.outputs.dashboard }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Against the base of the pull request, or against what `main` was before
      # the push. A manual run has neither, and reaches every app.
      - name: Say which apps the change reaches
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/affected-apps.mjs "$BASE" | tee -a "$GITHUB_OUTPUT"

      # The tests that matter are the ones a mock cannot have: a session whose
      # row was deleted, an expiry that has passed, a constraint refusing a row.
      # They need a database. Only the backend's suite has them, so a change that
      # cannot reach the backend starts none, and those tests skip.
      #
      # A step rather than a service container, because a service starts before
      # the first step and so before anything knows what changed. The same
      # version production runs, from Docker's own copy on Amazon ECR Public:
      # Docker Hub wants a token from auth.docker.io before every pull, and when
      # that does not answer, nothing merges and nothing deploys.
      #
      # The roles and the test database come from the same scripts
      # `docker compose up -d` uses locally, so there is one description of that
      # shape rather than two.
      - name: Start the test database
        if: steps.affected.outputs.backend == 'true'
        env:
          ADMIN_URL: postgres://layered:layered_local@127.0.0.1:5432/postgres
        run: |
          docker run --detach --publish 5432:5432 \
            --env POSTGRES_USER=layered \
            --env POSTGRES_PASSWORD=layered_local \
            --env POSTGRES_DB=layered \
            public.ecr.aws/docker/library/postgres:18-alpine
          until psql "$ADMIN_URL" --quiet --command "select 1" >/dev/null 2>&1; do
            [ "$SECONDS" -lt 120 ] || { echo "The test database did not answer within two minutes." >&2; exit 1; }
            sleep 1
          done
          for script in scripts/local-database/*.sql; do
            psql "$ADMIN_URL" --quiet --set ON_ERROR_STOP=1 --file "$script"
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          # Named here rather than left to a file, so a run that started a
          # database fails on the connection instead of skipping twenty tests.
          DATABASE_URL_TEST: ${{ steps.affected.outputs.backend == 'true' && 'postgres://layered_app:layered_local@127.0.0.1:5432/layered_test' || '' }}
      - run: pnpm build
      - run: pnpm --filter @layered/website test:production

      # Anything a build generates and the repository keeps is checked here.
      # `packages/tokens/src/generated/` is derived from the stylesheets and
      # committed so that a type check needs no build; without this a stale
      # copy is invisible, because nothing fails when it disagrees with its
      # source, a component simply offers a value the stylesheet has no
      # property for.
      - name: Refuse a generated file that was not regenerated
        run: git diff --exit-code

      # Which workspaces actually carry a suite, printed rather than assumed. A
      # job named `gate` that silently covers one workspace of four is the
      # failure this line exists to make visible.
      - name: Say which workspaces carry tests
        run: pnpm -r exec node -e "const p=require('./package.json'); if (p.scripts?.test) console.log(p.name)"
