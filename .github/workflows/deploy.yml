name: Deploy

# A deployment is always a merged pull request. A ruleset refuses anything else
# reaching `main`, so a push here has passed the gate below by definition.
#
# Nothing in this file interpolates anything a stranger can write. The only
# `run` steps are fixed commands, and the values they read are repository
# variables and secrets, which only the owner sets.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: "Deploy the backend"
        type: boolean
        default: true
      website:
        description: "Deploy the website"
        type: boolean
        default: true
      dashboard:
        description: "Deploy the dashboard"
        type: boolean
        default: true

permissions:
  contents: read

# A run on main deploys, and cancelling that half way would leave a service
# mid-rollout. Two overlapping deployments also make the earlier run's smoke
# test hit a host the later one is still replacing, so they queue.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate the pull request ran, against the merged tree. It is called
  # rather than written out again, so the two cannot come to check different
  # things.
  gate:
    uses: ./.github/workflows/gate.yml

  # Which services a change can actually reach, decided from the workspace graph
  # rather than from a guess. Anything shared by all three, and anything not
  # attributable to a single service, deploys everything, because a service left
  # on a stale build costs more than a redundant deployment.
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      website: ${{ steps.filter.outputs.website }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            everything: &everything
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'biome.json'
              - '.nvmrc'
              - 'zerops.yml'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/gate.yml'
              - 'scripts/**'
              - 'packages/schemas/**'
              - 'packages/content/**'
            surfaces: &surfaces
              - *everything
              - 'packages/tokens/**'
              - 'packages/ui/**'
            backend:
              - *everything
              - 'apps/backend/**'
            website:
              - *surfaces
              - 'apps/website/**'
            dashboard:
              - *surfaces
              - 'apps/dashboard/**'

  deploy-backend:
    needs: [gate, changes]
    if: >-
      always() && needs.gate.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.backend == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.backend))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: zeropsio/actions@79c2d03f7c82ac58d011be746da3332f2f93c680 # v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_BACKEND_SERVICE_ID }}

  deploy-website:
    needs: [gate, changes]
    if: >-
      always() && needs.gate.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.website == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.website))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: zeropsio/actions@79c2d03f7c82ac58d011be746da3332f2f93c680 # v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_WEBSITE_SERVICE_ID }}

  deploy-dashboard:
    needs: [gate, changes]
    if: >-
      always() && needs.gate.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.dashboard == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.dashboard))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: zeropsio/actions@79c2d03f7c82ac58d011be746da3332f2f93c680 # v1.0.1
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_DASHBOARD_SERVICE_ID }}

  # Runs when at least one service deployed and none failed. It checks the
  # things that break silently, and it reports the figures rather than asserting
  # that something is configured.
  smoke:
    needs: [deploy-backend, deploy-website, deploy-dashboard]
    if: >-
      always() &&
      needs.deploy-backend.result != 'failure' &&
      needs.deploy-website.result != 'failure' &&
      needs.deploy-dashboard.result != 'failure' &&
      (needs.deploy-backend.result == 'success' ||
       needs.deploy-website.result == 'success' ||
       needs.deploy-dashboard.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # The site and the dashboard answer on their own names; the API has no
      # record yet and is reached through its Zerops subdomain until it does.
      - run: bash scripts/smoke.sh
        env:
          SITE_URL: https://layered.work
          API_URL: https://backend-2444-3000.prg1.zerops.app
          DASHBOARD_URL: https://dashboard.layered.work
