name: CI

# Runs on every pull request, which is the only way anything reaches `main`.
# The deploy workflow calls the same gate again after the merge, against the
# merged tree rather than against the branch.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
